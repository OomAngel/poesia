# Influence Registry — Structured YAML
# Angel's poetic influences with tone profiles and exemplars.
# Replaces docs/INFLUENCE_REGISTRY.md for programmatic access.

spanish:
  - id: antonio_machado
    name: Antonio Machado
    era: "1875-1939"
    movement: Generación del 98
    tone: [spare, meditative, honest, austere, landscape-as-interior]
    forms: [romance, soneto, free verse]
    exemplars:
      - "Caminante, son tus huellas el camino y nada más"
      - "Hoy es siempre todavía"

  - id: pablo_neruda
    name: Pablo Neruda
    era: "1904-1973"
    movement: "Surrealism → Political → Late simplicity"
    tone: [sensual, elemental, political, expansive, intimate]
    exemplars:
      - "Puedo escribir los versos más tristes esta noche"
      - "Me gustas cuando callas"

  - id: luis_g_urbina
    name: Luis G. Urbina
    era: "1864-1934"
    movement: Modernismo (Mexican)
    tone: [melancholic, tender, intimate, nostalgic]
    exemplars:
      - "Vieja lágrima"

  - id: manuel_gutierrez_najera
    name: Manuel Gutiérrez Nájera
    era: "1859-1895"
    movement: Modernismo (precursor)
    tone: [elegant, musical, wistful, Parisian]
    exemplars:
      - "Quiero morir cuando decline el día"

  - id: miguel_hernandez
    name: Miguel Hernández
    era: "1910-1942"
    movement: Generación del 27
    tone: [earthy, passionate, tragic, popular]
    exemplars:
      - "Llegó con tres heridas: la del amor, la de la muerte, la de la vida"

