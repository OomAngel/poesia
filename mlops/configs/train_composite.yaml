# Composite loss training — CE + scorer feedback
# The model learns that correct syllables affect its loss directly
experiment: "soneto-composite"
run_name: "v1-composite"
tags: ["soneto", "composite-loss", "r16-ce+scorer"]

model: "Qwen/Qwen2.5-1.5B-Instruct"
quantization: "4bit"

train_data: "seeds/poetry_corpus/training_data_structured/sonetos_filtered_t2.jsonl"
eval_data: "seeds/poetry_corpus/training_data_structured/sonetos_train.jsonl"
max_length: 256

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Composite loss
loss_fn: "composite"  # "ce" | "composite" | "dpo"
scorer_weight: 0.15

# Training
batch_size: 8
gradient_accumulation: 2
epochs: 10
learning_rate: 0.0002
lr_scheduler: "cosine"
warmup_steps: 50
weight_decay: 0.01
fp16: true
logging_steps: 10
eval_steps: 50
save_steps: 100

# Output
output_dir: "models/poetry-lora-composite"
