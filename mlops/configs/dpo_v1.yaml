# DPO training — learn to prefer good lines over bad ones
# Uses LineScorer.composite_score() as reward signal (metre, rhyme, theme, novelty, cliché)
# Data: expanded corpus from ingest_poems.py (1000 curated sonetos + 1000 varied poems)
experiment: "soneto-dpo-expanded"
run_name: "v1-dpo-expanded"
tags: ["soneto", "dpo", "r16-dpo", "expanded-data"]

model: "Qwen/Qwen2.5-1.5B-Instruct"
quantization: "4bit"

# Data: merged expanded datasets (2000+ poems)
train_data: "seeds/poetry_corpus/training_data_structured/sonetos_expanded.jsonl"
max_length: 256

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# DPO
dpo_beta: 0.1  # lower = more aggressive preference learning

# Training
batch_size: 4
gradient_accumulation: 2
epochs: 5
learning_rate: 0.00005  # 5e-5 — explicit decimal for PyYAML 6.x compatibility
bf16: false
fp16: false
optim: "adamw_torch"  # non-fused; model compute dtype from BitsAndBytesConfig
logging_steps: 10
save_steps: 50

# Output
output_dir: "models/poetry-lora-dpo-expanded"
