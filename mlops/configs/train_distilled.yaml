# Training configuration — v2: distilled sonetos from Groq
# Uses lessons from v2 (soneto-structured, r=16) and v3 (multiform, r=32)
# Distilled data is cleaner (Groq-generated, validated), so r=32 should learn more patterns
experiment: "soneto-distilled"
run_name: "v1-distilled"
tags: ["soneto", "distilled", "groq", "r32"]
model: "Qwen/Qwen2.5-1.5B-Instruct"
quantization: "4bit"

# Data: generated by scripts/distill_sonetos.py
train_data: "seeds/poetry_corpus/training_data_distilled/sonetos.jsonl"
eval_data: "seeds/poetry_corpus/training_data_distilled/sonetos.jsonl"
max_length: 300

# LoRA — increased from r=16 to r=32 for more capacity on clean data
lora_r: 32
lora_alpha: 64
lora_dropout: 0.1
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Training — lower LR with cosine decay for stable convergence
batch_size: 8
gradient_accumulation: 2
epochs: 10
learning_rate: 0.0001
lr_scheduler: "cosine"
warmup_steps: 50
weight_decay: 0.01
fp16: true
logging_steps: 10
eval_steps: 50
save_steps: 100

# Output
output_dir: "models/poetry-lora-distilled"
