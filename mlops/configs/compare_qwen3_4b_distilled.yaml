# Base-model comparison (§6 step 3): the baseline recipe with only the base model changed
# (batch split 4x4 instead of 8x2 for VRAM; effective batch unchanged). Qwen3-4B ties its
# embeddings, so it uses the default memory layout.
# Training configuration — v2: distilled sonetos from Groq
# Uses lessons from v2 (soneto-structured, r=16) and v3 (multiform, r=32)
# Distilled data is cleaner (Groq-generated, validated), so r=32 should learn more patterns
experiment: "retrain-2026-10"
run_name: "compare-distilled-qwen3-4b"
tags: ["soneto", "distilled", "groq", "r32"]
model: "Qwen/Qwen3-4B-Instruct-2507"
quantization: "4bit"

# Data: generated by scripts/distill_sonetos.py
train_data: "seeds/poetry_corpus/training_data_distilled/sonetos.jsonl"
eval_data: "seeds/poetry_corpus/training_data_distilled/sonetos.jsonl"
max_length: 300

# LoRA — increased from r=16 to r=32 for more capacity on clean data
lora_r: 32
lora_alpha: 64
lora_dropout: 0.1
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Training — lower LR with cosine decay for stable convergence
batch_size: 4
gradient_accumulation: 4  # same effective batch (16) as the baseline, less VRAM
epochs: 10
learning_rate: 0.0001
lr_scheduler: "cosine"
warmup_steps: 50
weight_decay: 0.01
fp16: true
logging_steps: 10
eval_steps: 50
save_steps: 100

# Output
output_dir: "models/compare-qwen3-4b-distilled"

# 2026-10 retraining (docs/RETRAINING_PLAN_2026-10.md §6): evaluated with
# scripts/evaluate_adapter_mlflow.py, not the old auto-evaluation.
auto_evaluate: false
