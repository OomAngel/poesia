# ═══════════════════════════════════════════════════════════════════════
# train_v2_fixed.yaml — Retraining with corrected prompt format
# ═══════════════════════════════════════════════════════════════════════
# FIXES the core inference bug: training prompts now match inference
# prompts exactly (line-by-line "Write line N. Exactly N syllables...
# Output ONLY the single bare poetry line").
#
# Also adds title-generation examples so the model can title its own poems.
#
# Data: mlops/data/train_fixed.jsonl + eval_fixed.jsonl
#   Built by: python scripts/build_fixed_dataset.py
#   ~7,400 unique poems → ~100K line-by-line examples
# ═══════════════════════════════════════════════════════════════════════

experiment: "soneto-v2-fixed"
run_name: "v2-fixed-format"
tags: ["soneto", "v2", "fixed-format", "line-by-line", "titles"]

model: "Qwen/Qwen2.5-1.5B-Instruct"
quantization: "4bit"

# Data — fixed-format line-by-line examples
train_data: "mlops/data/train_fixed.jsonl"
eval_data: "mlops/data/eval_fixed.jsonl"
max_length: 300

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Training
batch_size: 4
gradient_accumulation: 2
effective_batch: 8
epochs: 1
learning_rate: 0.0001
lr_scheduler: "cosine"
warmup_steps: 50
weight_decay: 0.01
fp16: true
logging_steps: 25
save_steps: 500
save_total_limit: 2

# Output
output_dir: "models/poetry-lora-v2-fixed"

# Loss
loss_fn: "ce"

# Notes
# - 1 epoch over 38K examples ≈ 4,750 steps at effective batch 8
# - Estimated ~2h on RTX 2000 Ada
# - Post-training pipeline auto-runs evaluation + registry + PG migration
