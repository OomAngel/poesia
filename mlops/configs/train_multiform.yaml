experiment: "multiform"
run_name: "v1-multiform"
tags: ["multiform", "soneto", "romance", "decima", "haiku", "cuarteto"]

model: "Qwen/Qwen2.5-1.5B-Instruct"
quantization: "4bit"

# Data: curated multi-form dataset
train_data: "seeds/poetry_corpus/training_data_structured/multiform_train.jsonl"
eval_data: "seeds/poetry_corpus/training_data_structured/sonetos.jsonl"
max_length: 300

# LoRA
lora_r: 32
lora_alpha: 64
lora_dropout: 0.1
lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Training
batch_size: 8
gradient_accumulation: 2
epochs: 12
learning_rate: 0.0001
lr_scheduler: "cosine"
warmup_steps: 50
weight_decay: 0.01
fp16: true
logging_steps: 10
eval_steps: 50
save_steps: 100

# Output
output_dir: "models/poetry-lora-multiform"
