<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoesIA</title>
<style>
:root {
  --bg: #faf8f4; --fg: #1f1d1a; --muted: #6b665e; --line: #ddd7cc; --accent: #7a3e1d;
  --ok: #2f6b3a; --warn: #9a5b00; --bad: #a3271f; --card: #ffffff; --ghost: #9a948a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #171614; --fg: #ece8e1; --muted: #a39d93; --line: #3a3732; --accent: #e09a6b;
          --ok: #7cc28a; --warn: #e2b05a; --bad: #ef8a80; --card: #201f1c; --ghost: #7d786f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 17px/1.5 Georgia, "Iowan Old Style", serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 96px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
h2 { font-size: 1.15rem; margin: 0 0 10px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
fieldset, .panel { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
           margin: 0 0 16px; background: var(--card); }
legend { padding: 0 6px; color: var(--muted); font-size: .9rem; }
label { display: block; font-size: .9rem; color: var(--muted); margin: 6px 0 2px; }
input[type=text], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg);
       border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
textarea.reflection { min-height: 90px; resize: vertical; }
textarea.verse { resize: none; overflow: hidden; min-height: 2.6em; line-height: 1.45; }
button { font: inherit; font-size: .92rem; border: 1px solid var(--line); background: var(--card);
         color: var(--fg); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
button.link { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.choice { text-align: left; padding: 12px 14px; }
.choice strong { display: block; font-size: 1.05rem; }
.choice span { color: var(--muted); font-size: .88rem; }
.choice[aria-pressed=true] { border: 2px solid var(--accent); }
.stanza { padding: 4px 0 12px; }
.stanza + .stanza { border-top: 1px dashed var(--line); padding-top: 12px; }
.line { padding: 6px 0; }
.lhead { display: flex; gap: 8px; align-items: baseline; font-size: .82rem; color: var(--muted);
         flex-wrap: wrap; }
.lnum { min-width: 1.6em; font-variant-numeric: tabular-nums; }
.badge { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.ok { color: var(--ok); } .short, .over { color: var(--warn); } .norhyme { color: var(--bad); }
.lbody { display: flex; gap: 8px; align-items: flex-start; }
.lbody textarea { flex: 1; }
.status { font-size: .88rem; margin: 4px 0 0 2.2em; }
details.why { font-size: .86rem; color: var(--muted); margin: 2px 0 0 2.2em; }
details.why summary { cursor: pointer; }
details.why ul { margin: 4px 0; padding-left: 1.2em; }
.props { margin: 6px 0 0 2.2em; display: grid; gap: 4px; }
.prop { display: flex; gap: 8px; align-items: center; color: var(--ghost); font-style: italic; }
.prop span { flex: 1; }
.origin { font-size: .75rem; color: var(--ghost); }
.words { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.words .lead { color: var(--muted); font-size: .88rem; flex-basis: 100%; }
.words button.word { border-radius: 999px; padding: 3px 10px; font-size: .9rem; }
.words button.word small { color: var(--ghost); margin-left: 4px; }
.bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
       padding: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.note { color: var(--muted); font-size: .85rem; }
.sr { position: absolute; left: -9999px; }
.pause { border: 2px solid var(--accent); border-radius: 12px; padding: 16px; margin: 0 0 16px;
         background: var(--card); }
.pause h2 { margin: 0 0 8px; }
.pause ul { padding-left: 1.2em; } .pause li { margin: 6px 0; }
.pause .num { font-weight: bold; font-size: 1.1rem; }
.linked { border-top: 1px solid var(--line); padding: 10px 0; }
.linked h3 { margin: 0; font-size: 1rem; } .linked .by { color: var(--muted); font-size: .88rem; }
.linked pre, pre.poemview { font: inherit; white-space: pre-wrap; margin: 6px 0; }
.linked .credit { font-size: .75rem; color: var(--ghost); }
.topline { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; padding: 0; list-style: none; }
.steps button { border-radius: 999px; font-size: .85rem; padding: 5px 12px; }
.steps button[aria-current=step] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.next { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin: 8px 0 16px; flex-wrap: wrap; }
.syl { font-size: .9rem; color: var(--muted); margin: 3px 0 0 2.2em; letter-spacing: .01em; }
.syl b { color: var(--fg); }
.syl .dot { color: var(--ghost); padding: 0 1px; }
.syl .join { color: var(--accent); font-weight: bold; }
.rmark { display: inline-block; width: .8em; height: .8em; border-radius: 50%; vertical-align: middle; }
.hint { color: var(--warn); }
.setup { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px;
         padding: 10px 12px; margin: 0 0 16px; background: var(--card); font-size: .92rem; }
.setup progress { width: 100%; margin-top: 6px; }
#printArea { display: none; }
@media print {
  body { background: #fff; }
  body > main > *:not(#printArea) { display: none !important; }
  #printArea { display: block; font: 13pt/1.6 Georgia, serif; color: #000; }
  #printArea h1 { font-size: 18pt; } #printArea .stmt { font-size: 10pt; color: #444; margin-top: 2em; }
}
[hidden] { display: none !important; }
/* Phones: the action bar sits after the poem instead of floating over the lines. */
@media (max-width: 600px) {
  .bar { position: static; }
  .bar button { flex: 1 1 auto; }
  .status, details.why, .props, .syl { margin-left: 0; }
  main { padding-bottom: 32px; }
}
</style>
</head>
<body>
<main>
  <div class="topline">
    <h1>PoesIA</h1>
    <button class="link" id="changeLang" hidden></button>
  </div>
  <p class="sub" id="tagline"></p>

  <!-- 1. Language: the whole page follows it -->
  <section class="panel" id="langStep">
    <h2>Write in · Escribe en · Scrivi in</h2>
    <div class="choices">
      <button class="choice" data-lang="es"><strong>Español</strong><span>soneto, haiku, verso libre</span></button>
      <button class="choice" data-lang="en"><strong>English</strong><span>sonnet, haiku, free verse</span></button>
      <button class="choice" data-lang="it"><strong>Italiano</strong><span>sonetto, verso libero</span></button>
    </div>
    <p><button class="link" id="openStart">Open a saved poem · Abrir un poema guardado · Apri una poesia salvata</button></p>
  </section>

  <div class="setup" id="setup" role="status" hidden><span id="setupText"></span>
    <progress id="setupBar" max="1" value="0" hidden></progress></div>

  <div id="writer" hidden>
    <section class="pause" id="pause" role="alertdialog" aria-modal="true" aria-labelledby="pauseTitle" aria-describedby="pauseText" hidden>
      <h2 id="pauseTitle" tabindex="-1"></h2>
      <p id="pauseText"></p>
      <ul id="pauseList"></ul>
      <p class="note" id="pauseNote"></p>
      <button id="pauseContinue"></button>
    </section>

    <nav aria-label="steps"><ol class="steps" id="steps">
      <li><button data-step="1"></button></li><li><button data-step="2"></button></li>
      <li><button data-step="3"></button></li><li><button data-step="4"></button></li>
    </ol></nav>

    <section id="step1">
    <fieldset>
      <legend id="startLegend"></legend>
      <label for="theme" id="themeLabel"></label>
      <input type="text" id="theme" maxlength="200">
      <label for="reflection" id="reflectionLabel"></label>
      <textarea class="reflection" id="reflection" maxlength="4000"></textarea>
    </fieldset>
    <div class="next"><button class="primary" data-goto="2"></button></div>
    </section>

    <section id="step2" hidden>
    <fieldset>
      <legend id="formLegend"></legend>
      <div class="choices" id="forms" role="group"></div>
    </fieldset>
    <div class="next"><button class="primary" data-goto="3"></button></div>
    </section>

    <section id="step3" hidden>
    <fieldset>
      <legend id="poemLegend"></legend>
      <div id="lines"></div>
      <button id="addLine" hidden></button>
    </fieldset>
    <div class="next"><span class="note" id="authorship" aria-live="polite"></span>
      <button class="primary" data-goto="4"></button></div>
    <p class="note" id="footnote"></p>
    </section>

    <section id="step4" hidden>
    <fieldset>
      <legend id="listenLegend"></legend>
      <pre class="poemview" id="poemView"></pre>
      <div class="next" style="justify-content:flex-start"><button id="listen"></button></div>
    </fieldset>
    <fieldset>
      <legend id="linkLegend"></legend>
      <p class="note" id="linkNote"></p>
      <button id="linkBtn"></button>
      <div id="links"></div>
    </fieldset>
    <fieldset>
      <legend id="keepLegend"></legend>
      <div class="next" style="justify-content:flex-start">
        <button class="primary" id="keepTxt"></button>
        <button id="print"></button>
        <button id="keep"></button>
        <label class="sr" for="openFile" id="openLabel"></label>
        <button id="openBtn"></button>
        <input type="file" id="openFile" accept=".json,application/json" hidden>
      </div>
      <p class="note" id="keepNote"></p>
    </fieldset>
    <div class="next" style="justify-content:flex-start"><button id="clear"></button></div>
    </section>
  </div>
  <div id="printArea"><h1 id="printTitle"></h1><pre id="printPoem" style="font: inherit; white-space: pre-wrap"></pre>
    <p class="stmt" id="printStmt"></p></div>
  <div class="sr" aria-live="polite" id="live"></div>
</main>

    footnote: "Le idee arrivano solo se le chiedi: prima parole in rima, da un elenco; versi interi, se li vuoi, da un modello che gira su questo computer. Sono un punto di partenza: cambiale o ignorale. La bozza resta in questa scheda e sparisce quando la chiudi, a meno che tu non conservi la poesia.",
    linkLegend: "Poesie che si sentono così",
    linkNote: "Se vuoi, leggi due o tre poesie antiche vicine a ciò che hai scritto. Sono di pubblico dominio o con licenza aperta.",
    linkBtn: "Mostra", looking: "Cerco…", writeFirst: "Scrivi prima qualcosa.",
    notAvailable: "Non disponibile: ", untitled: "Senza titolo",
    pauseTitle: "Fermiamoci un momento",
    pauseText: "Ciò che hai scritto conta. Se stai pensando di farti del male o di fare del male a qualcuno, parla con qualcuno adesso. Questi servizi sono gratuiti e riservati:",
    pauseNote: "PoesIA è uno strumento per scrivere, non un servizio di aiuto. Niente di ciò che hai scritto è uscito da questo computer o è stato salvato.",
    pauseContinue: "Continua a scrivere",
    forms: {
      sonetto: ["Sonetto", "14 endecasillabi; rima ABBA ABBA CDE CDE."],
      free: ["Verso libero", "Senza metro né rima: scrivi al tuo ritmo; PoesIA conta e ascolta soltanto."],
    },
  },
};

let forms = [];
let state = { lang: "", formKey: "", theme: "", reflection: "", lines: [], step: 1 };
const RHYME_COLOURS = ["#c0392b", "#2471a3", "#1e8449", "#b9770e", "#7d3c98", "#117a65", "#a04000"];
// each line: { text, origin: "human"|"proposal-accepted"|"proposal-edited", proposal: "" }
const T = () => STR[state.lang] || STR.en;

function save() { try { sessionStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function load() { try { const s = JSON.parse(sessionStorage.getItem(STORE) || "null"); if (s) state = s; } catch (e) {} }
function langForms() { return forms.filter(f => f.language === state.lang); }
function currentForm() { return forms.find(f => f.language + ":" + f.form === state.formKey) || langForms()[0]; }
function texts() { return state.lines.map(l => l.text); }

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function editDistance(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= n; j++) {
      const t = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = t;
    }
  }
  return d[n];
}

function applyText() {
  const t = T();
  document.documentElement.lang = state.lang || "en";
  for (const id of ["tagline", "changeLang", "startLegend", "themeLabel", "reflectionLabel", "formLegend",
                    "poemLegend", "addLine", "linkLegend", "linkNote", "linkBtn", "keep", "clear",
                    "footnote", "pauseTitle", "pauseText", "pauseNote", "pauseContinue",
                    "keepLegend", "keepTxt", "print", "openBtn", "keepNote"]) {
    if ($(id)) $(id).textContent = t[id];
  }
  $("listen").textContent = t.listen;
  $("keep").textContent = t.keepJson;
  $("theme").placeholder = t.themePh;
  $("listenLegend").textContent = t.listenLegend;
  document.querySelectorAll("[data-step]").forEach(b => { b.textContent = `${b.dataset.step}. ${t.steps[b.dataset.step - 1]}`; });
  document.querySelectorAll("[data-goto]").forEach(b => { b.textContent = `${t.next}: ${t.steps[b.dataset.goto - 1]} →`; });
}

let modelsReady = true;
async function pollSetup() {
  // First run: show the model download in the page, not only in a terminal (plan P4).
  let st;
  try { st = await (await fetch("/api/status")).json(); } catch (e) { setTimeout(pollSetup, 3000); return; }
  const t = T().setup, box = $("setup"), bar = $("setupBar");
  modelsReady = st.phase === "ready";
  document.querySelectorAll(".needsModel, #linkBtn").forEach(b => { b.disabled = !modelsReady; });
  if (modelsReady) {
    // P6: a model split onto the processor is slow; say so instead of leaving it a mystery.
    const g = st.gpu_fraction;
    if (typeof g === "number" && g < 1) {
      box.hidden = false; $("setupBar").hidden = true;
      $("setupText").textContent = g === 0 ? t.cpuOnly : t.cpuSplit(`${Math.round((1 - g) * 100)} %`);
    } else box.hidden = true;
    return;
  }
  const gb = (x) => (x / 1e9).toLocaleString(state.lang || "en", { maximumFractionDigits: 1 });
  const m = t.models[st.model] || st.model;
  box.hidden = false;
  $("setupText").textContent = st.phase === "downloading" && st.total ? t.downloading(m, gb(st.completed), gb(st.total))
    : st.phase === "error" ? t.error(st.error) : (t[st.phase] || t.checking)(m);
  bar.hidden = !(st.phase === "downloading" && st.total);
  if (st.total) { bar.max = st.total; bar.value = st.completed; }
  if (st.phase !== "error") setTimeout(pollSetup, 2000);
}

function showStep(n) {
  state.step = n; save();
  for (let k = 1; k <= 4; k++) $("step" + k).hidden = k !== n;
  document.querySelectorAll("[data-step]").forEach(b => {
    if (Number(b.dataset.step) === n) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });
  if (n === 3) renderLines();
  if (n === 4) $("poemView").textContent = state.lines.map(l => l.text).filter(x => x.trim()).join("\n");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function goTo(n) {
  if (state.step === 1 && n > 1 && await screenText(state.reflection)) return;  // pause before shaping
  showStep(n);
}

function renderForms() {
  const t = T(), box = $("forms"); box.innerHTML = "";
  const cur = currentForm();
  langForms().forEach(f => {
    const key = f.language + ":" + f.form, [name, desc] = t.forms[f.form] || [f.form, ""];
    const b = document.createElement("button");
    b.className = "choice"; b.setAttribute("aria-pressed", String(cur && key === cur.language + ":" + cur.form));
    b.innerHTML = "<strong></strong><span></span>";
    b.querySelector("strong").textContent = name; b.querySelector("span").textContent = desc;
    b.addEventListener("click", () => {
      if (key === state.formKey) return;
      if (state.lines.some(l => l.text.trim()) && !confirm(t.changeAsk)) return;
      state.formKey = key; state.lines = []; save(); renderForms(); renderLines();
    });
    box.appendChild(b);
  });
}

function stanzaOf(f, i) {
  if (!f.stanzas || !f.stanzas.length) return 0;
  let acc = 0;
  for (let s = 0; s < f.stanzas.length; s++) { acc += f.stanzas[s]; if (i < acc) return s; }
  return f.stanzas.length - 1;
}

function autosize(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }

function renderLines(append = false) {
  // append: add only lines not on the page yet (a newly revealed stanza), so the lines
  // already there keep their focus, cursor and any open suggestions.
  const f = currentForm(), t = T(); if (!f) return;
  while (state.lines.length < f.lines) state.lines.push({ text: "", origin: "human", proposal: "" });
  if (!f.free) state.lines.length = f.lines;
  $("addLine").hidden = !f.free;
  const box = $("lines"); if (!append) box.innerHTML = "";
  let stanzaBox = null, stanzaIdx = -1;
  // Stanza by stanza: the next stanza appears once the one before it has a line.
  let shown = 0;
  if (f.free || !f.stanzas.length) shown = state.lines.length;
  else for (let k = 0; k < state.lines.length; k++) {
    const st = stanzaOf(f, k);
    if (st === 0 || state.lines.some((l, j) => stanzaOf(f, j) === st - 1 && l.text.trim())) shown = k + 1; else break;
  }
  const letters = [...new Set((f.scheme || "").split("").filter(c => /[A-Z]/.test(c)))];
  state.lines.forEach((ln, i) => {
    if (i >= shown || (append && $("in" + i))) return;
    const s = stanzaOf(f, i);
    if (s !== stanzaIdx || !stanzaBox) { stanzaBox = document.createElement("div"); stanzaBox.className = "stanza"; box.appendChild(stanzaBox); stanzaIdx = s; }
    const div = document.createElement("div"); div.className = "line";
    const target = f.syllables[i];
    div.innerHTML = `
      <div class="lhead"><span class="lnum">${i + 1}</span>
        ${f.scheme && /[A-Z]/.test(f.scheme[i] || "") ? `<span class="rmark" title="${f.scheme[i]}" style="background:${RHYME_COLOURS[letters.indexOf(f.scheme[i]) % RHYME_COLOURS.length]}"></span>` : ""}
        <span class="badge count" id="count${i}">${target ? "– / " + target : "–"} ${t.syll}</span>
        <span class="origin" id="origin${i}"></span></div>
      <div class="lbody">
        <label class="sr" for="in${i}">${t.line} ${i + 1}</label>
        <textarea class="verse" id="in${i}" rows="1" maxlength="300" autocomplete="off"></textarea>
        <button id="sug${i}" title="${t.ideasTitle}">${t.ideas}</button>
      </div>
      <div class="syl" id="syl${i}" aria-hidden="true"></div>
      <div class="status" id="status${i}"></div>
      <details class="why" id="whybox${i}" hidden><summary>${t.why}</summary><ul id="why${i}"></ul></details>
      <div class="props" id="props${i}"></div>`;
    stanzaBox.appendChild(div);
    const inp = $("in" + i); inp.value = ln.text; autosize(inp);
    inp.addEventListener("blur", () => { ln.caret = inp.selectionStart; });
    let timer = null;
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\n/g, " "); autosize(inp);
      ln.text = inp.value;
      if (ln.origin !== "human" && ln.proposal) ln.origin = inp.value === ln.proposal ? "proposal-accepted" : "proposal-edited";
      showOrigin(i); save(); authorship();
      clearTimeout(timer); timer = setTimeout(() => { check(i); revealNext(i); }, 350);
    });
    inp.addEventListener("keydown", (e) => {   // Enter goes to the next line, as in a poem
      if (e.key === "Enter") { e.preventDefault(); const next = $("in" + (i + 1)); if (next) next.focus(); else if (f.free) addLine(); }
    });
    inp.addEventListener("blur", () => screenText(ln.text));
    $("sug" + i).addEventListener("click", () => suggest(i));
    showOrigin(i);
    if (ln.text) check(i);
  });
  authorship();
}

function revealNext(i) {
  // A stanza's first line written: show the next stanza without losing focus.
  const f = currentForm();
  if (f.free || !f.stanzas.length) return;
  const nextFirst = (() => { let acc = 0; for (const n of f.stanzas) { acc += n; if (acc > i) return acc; } return -1; })();
  // Appended, not redrawn: a redraw 350 ms after typing pulled focus back to this line while
  // the author was already on the next one, and wiped open suggestions (found 2026-10-07).
  if (nextFirst > 0 && nextFirst < state.lines.length && !$("in" + nextFirst)) renderLines(true);
}

function addLine() {
  state.lines.push({ text: "", origin: "human", proposal: "" }); save(); renderLines();
  const last = $("in" + (state.lines.length - 1)); if (last) last.focus();
}

function wordsKept(ln) {
  // Suggested words still in the line (the author may have deleted or replaced them).
  const have = new Set(ln.text.toLowerCase().split(/[^\p{L}]+/u));
  return [...new Set(ln.words || [])].filter(w => have.has(w.toLowerCase()));
}

function showOrigin(i) {
  const ln = state.lines[i], t = T(), kept = wordsKept(ln);
  $("origin" + i).textContent = ln.origin === "human" ? (kept.length ? t.wordUsed(kept.join(", ")) : "")
    : { "proposal-accepted": t.used, "proposal-edited": t.edited }[ln.origin];
}

async function check(i) {
  const f = currentForm(), t = T(), count = $("count" + i), status = $("status" + i);
  const target = f.syllables[i];
  if (!state.lines[i].text.trim()) {
    count.textContent = `${target ? "– / " + target : "–"} ${t.syll}`; count.className = "badge count";
    status.textContent = ""; $("whybox" + i).hidden = true; $("syl" + i).innerHTML = ""; return;
  }
  try {
    const r = await api("/api/scan", { language: f.language, form: f.form, index: i, lines: texts() });
    count.textContent = `${r.syllables}${r.target ? " / " + r.target : ""} ${t.syll}`;
    count.className = "badge count " + (r.target ? (r.status === "ok" ? "ok" : r.status) : "");
    drawSyllables($("syl" + i), r.view || []);
    const parts = [];
    if (r.other_language) parts.push(r.messages[0]);
    if (r.target) parts.push(r.status === "ok" ? t.ok : t[r.status](Math.abs(r.syllables - r.target)));
    if (r.rhyme_partner !== null && r.rhymes !== null)
      parts.push(r.rhymes ? t.rhymeWith(r.rhyme_partner + 1) : t.rhymeMiss(r.rhyme_partner + 1));
    status.textContent = parts.join(" · ");
    status.className = "status " + (r.other_language ? "hint" : r.rhymes === false ? "norhyme" : (r.status === "ok" || !r.target ? "ok" : r.status));
    const why = $("why" + i); why.innerHTML = "";
    r.messages.forEach(m => { const li = document.createElement("li"); li.textContent = m; why.appendChild(li); });
    $("whybox" + i).hidden = !r.messages.length;
  } catch (e) { status.textContent = e.message; }
}

function drawSyllables(box, view) {
  // la·LU·na‿i·lu·MI·na : stressed syllables bold, merged vowels joined (U4)
  box.innerHTML = "";
  view.forEach((w, wi) => {
    w.syl.forEach((s, si) => {
      if (si) { const d = document.createElement("span"); d.className = "dot"; d.textContent = "·"; box.appendChild(d); }
      const el = document.createElement(s.s ? "b" : "span"); el.textContent = s.t; box.appendChild(el);
    });
    if (wi < view.length - 1) {
      const sep = document.createElement("span"); sep.className = w.join ? "join" : "";
      sep.textContent = w.join ? "‿" : " "; box.appendChild(sep);
    }
  });
}

async function suggest(i) {
  // U6: small suggestions first. Rhyme words from a word list (no model), whole lines on request.
  const f = currentForm(), t = T(), box = $("props" + i), btn = $("sug" + i);
  btn.disabled = true; box.textContent = t.thinking;
  try {
    const r = await api("/api/words", { language: f.language, form: f.form, index: i, lines: texts() });
    box.innerHTML = "";
    const row = document.createElement("div"); row.className = "words";
    const lead = document.createElement("span"); lead.className = "lead";
    lead.textContent = r.words.length ? t.rhymesWith(r.partner_word)
      : r.reason === "partner_empty" ? t.partnerEmpty(r.partner + 1)
      : r.reason ? t.wordsFirst : t.noWords;
    row.appendChild(lead);
    r.words.forEach(w => {
      const b = document.createElement("button"); b.className = "word"; b.type = "button";
      b.title = `${w.why} · ${t.wordHint}`; b.setAttribute("aria-label", `${w.word}: ${w.why}`);
      b.append(w.word); const n = document.createElement("small"); n.textContent = w.syllables; b.appendChild(n);
      b.addEventListener("click", () => insertWord(i, w.word));
      row.appendChild(b);
    });
    const more = document.createElement("button"); more.type = "button"; more.className = "needsModel";
    more.textContent = t.wholeLines; more.disabled = !modelsReady;
    more.addEventListener("click", () => proposeLines(i));
    row.appendChild(more);
    box.appendChild(row);
  } catch (e) { box.textContent = t.notAvailable + e.message; }
  finally { btn.disabled = false; }
}

function insertWord(i, word) {
  // Where the cursor was (remembered on blur), else at the end; the line stays the author's.
  const inp = $("in" + i), ln = state.lines[i];
  const at = Math.min(ln.caret ?? inp.value.length, inp.value.length);
  const before = inp.value.slice(0, at), after = inp.value.slice(at);
  const left = before && !/\s$/.test(before) ? before + " " : before;
  const right = after && !/^\s/.test(after) ? " " + after : after;
  inp.value = left + word + right; ln.text = inp.value; ln.caret = (left + word).length;
  ln.words = [...(ln.words || []), word];
  autosize(inp); showOrigin(i); save(); authorship(); check(i);
  inp.focus(); inp.setSelectionRange(ln.caret, ln.caret);
}

async function proposeLines(i) {
  const f = currentForm(), t = T(), box = $("props" + i);
  if (await screenText(state.reflection)) return;
  box.textContent = t.thinking;
  try {
    const r = await api("/api/propose", { language: f.language, form: f.form, index: i, lines: texts(),
      theme: state.theme, reflection: state.reflection, n: 3 });
    box.innerHTML = "";
    if (!r.proposals.length) box.textContent = t.noIdeas;
    r.proposals.forEach(p => {
      const row = document.createElement("div"); row.className = "prop";
      const span = document.createElement("span"); span.textContent = p.text;
      const meta = document.createElement("small");
      meta.textContent = p.check.target ? `${p.check.syllables}/${p.check.target}` + (p.check.rhymes === true ? " ✓" : "") : "";
      const use = document.createElement("button"); use.textContent = t.useIt;
      use.addEventListener("click", () => {
        const ln = state.lines[i]; ln.text = p.text; ln.proposal = p.text; ln.origin = "proposal-accepted";
        $("in" + i).value = p.text; autosize($("in" + i)); box.innerHTML = ""; showOrigin(i); save(); authorship(); check(i);
        $("in" + i).focus();
      });
      row.append(span, meta, use); box.appendChild(row);
    });
  } catch (e) { box.textContent = t.modelDown + e.message; }
}

let screened = "";
async function screenText(text) {
  if (!text || !text.trim() || text === screened) return false;
  try {
    const r = await api("/api/safety", { text, language: state.lang || "en" });
    screened = text;
    if (r.flagged) { showPause(r.resources); return true; }
  } catch (e) { /* the screen never blocks writing when the server is down */ }
  return false;
}

function showPause(resources) {
  const ul = $("pauseList"); ul.innerHTML = "";
  resources.forEach(r => {
    const li = document.createElement("li");
    const num = document.createElement("span"); num.className = "num"; num.textContent = r.number + " ";
    li.append(num, document.createTextNode(`${r.name}. ${r.note} `));
    if (r.url) { const a = document.createElement("a"); a.href = r.url; a.textContent = r.url.replace("https://", "");
      a.target = "_blank"; a.rel = "noopener"; li.appendChild(a); }
    ul.appendChild(li);
  });
  // U9: focus starts on the heading (read first, not dismissed by a stray Enter), stays in the
  // panel while it is open (Tab cycles links and the button; Escape continues) and returns
  // to where the person was.
  // During the check focus may already be on <body>; then go back to what they wrote.
  const was = document.activeElement;
  if ($("pause").hidden || !pauseReturn)  // shown again while open: keep the first target
    pauseReturn = was && was !== document.body && !$("pause").contains(was) ? was
      : $("reflection").offsetParent ? $("reflection") : null;
  $("pause").hidden = false; $("pause").scrollIntoView({ behavior: "smooth" }); $("pauseTitle").focus();
}

let pauseReturn = null;
function closePause() {
  $("pause").hidden = true;
  if (pauseReturn && document.contains(pauseReturn) && pauseReturn.offsetParent) pauseReturn.focus();
  else document.activeElement?.blur();  // never leave focus inside the hidden panel
  pauseReturn = null;
}

document.addEventListener("keydown", (e) => {
  if ($("pause").hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closePause(); return; }
  if (e.key !== "Tab") return;
  const items = [...$("pause").querySelectorAll("a[href], button")];
  const first = items[0], last = items[items.length - 1];
  const inside = $("pause").contains(document.activeElement);
  if (e.shiftKey && (!inside || document.activeElement === first || document.activeElement === $("pauseTitle"))) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && (!inside || document.activeElement === last)) {
    e.preventDefault(); first.focus();
  }
});

let player = null;
async function listen() {
  const f = currentForm(), t = T(), btn = $("listen");
  const text = state.lines.map(l => l.text.trim()).filter(Boolean).join("\n");
  if (!text) return;
  if (player && !player.paused) { player.pause(); btn.textContent = t.listen; return; }
  btn.disabled = true;
  try {
    const r = await fetch("/api/readback", { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify({ language: f.language, text }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    player = new Audio(URL.createObjectURL(await r.blob()));
    player.onended = () => { btn.textContent = t.listen; };
    btn.textContent = t.stop; player.play();
  } catch (e) { $("live").textContent = e.message; alert(e.message); }
  finally { btn.disabled = false; }
}

async function showLinks() {
  const f = currentForm(), t = T(), box = $("links"), btn = $("linkBtn");
  const text = [state.reflection, ...state.lines.map(l => l.text)].filter(x => x.trim()).join("\n");
  if (!text.trim()) { box.textContent = t.writeFirst; return; }
  if (await screenText(text)) return;
  btn.disabled = true; box.textContent = t.looking;
  try {
    const r = await api("/api/link", { language: f.language, text });
    box.innerHTML = "";
    r.poems.forEach(p => {
      const d = document.createElement("div"); d.className = "linked";
      const h = document.createElement("h3"); h.textContent = p.title || t.untitled;
      const by = document.createElement("div"); by.className = "by"; by.textContent = p.author || "";
      const pre = document.createElement("pre"); pre.textContent = p.text;
      const cr = document.createElement("div"); cr.className = "credit"; cr.textContent = p.licence;
      d.append(h, by, pre, cr); box.appendChild(d);
    });
  } catch (e) { box.textContent = t.notAvailable + e.message; }
  finally { btn.disabled = false; }
}

function authorship() {
  const filled = state.lines.filter(l => l.text.trim());
  const own = filled.filter(l => l.origin === "human").length;
  $("authorship").textContent = filled.length ? T().authorship(own, filled.length) : "";
}

function poemText() {
  const filled = state.lines.filter(l => l.text.trim());
  const own = filled.filter(l => l.origin === "human").length;
  return { title: state.theme.trim() || T().untitled, body: state.lines.map(l => l.text).join("\n").replace(/\n{3,}/g, "\n\n").trim(),
           stmt: T().stmt(own, filled.length) };
}

function download(name, blob) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function fileBase() { return (state.theme || "poema").replace(/[^\p{L}\p{N}]+/gu, "-").slice(0, 40); }

function keepText() {
  const p = poemText();
  download(`${fileBase()}.txt`, new Blob([`${p.title}\n\n${p.body}\n\n${p.stmt}\n`], { type: "text/plain;charset=utf-8" }));
}

function printPoem() {
  const p = poemText();
  $("printTitle").textContent = p.title; $("printPoem").textContent = p.body; $("printStmt").textContent = p.stmt;
  window.print();
}

function openSaved(file, done = () => {}) {
  const reader = new FileReader();
  reader.onerror = () => { alert(T().badFile); done(); };
  reader.onload = () => {
    done();
    try {
      const poem = JSON.parse(reader.result);
      if (!Array.isArray(poem.lines) || !poem.language || !poem.form) throw new Error("shape");
      state.lang = poem.language; state.formKey = poem.language + ":" + poem.form;
      state.theme = poem.theme || ""; state.reflection = poem.reflection || "";
      state.lines = poem.lines.map(l => ({ text: l.text || "", origin: l.origin || "human", proposal: l.proposal || "",
        words: l.suggested_words || [] }));
      $("theme").value = state.theme; $("reflection").value = state.reflection;
      save(); showWriter(); showStep(3);
    } catch (e) { alert(T().badFile); }
  };
  reader.readAsText(file);
}

function keep() {
  const f = currentForm();
  const lines = state.lines.map(l => ({ text: l.text, origin: l.origin, proposal: l.proposal,
    edit_distance: l.origin === "proposal-edited" ? editDistance(l.proposal, l.text) : 0,
    suggested_words: wordsKept(l) }));
  const own = lines.filter(l => l.text.trim() && l.origin === "human").length;
  const filled = lines.filter(l => l.text.trim()).length;
  const withWord = lines.filter(l => l.text.trim() && l.origin === "human" && l.suggested_words.length).length;
  const poem = { form: f.form, language: f.language, theme: state.theme,
    reflection: state.reflection, lines, kept_at: new Date().toISOString(),
    statement: `${own} of ${filled} lines worded by the author` +
      (withWord ? ` (${withWord} with a suggested rhyme word)` : "") + "; metre checked by PoesIA." };
  download(`${fileBase()}.json`, new Blob([JSON.stringify(poem, null, 2)], { type: "application/json" }));
}

function chooseLang(lang) {
  if (state.lang && state.lang !== lang && state.lines.some(l => l.text.trim()) && !confirm(T().changeAsk)) return;
  if (state.lang !== lang) { state.lines = []; state.formKey = ""; }
  state.lang = lang;
  if (!state.formKey) { const first = langForms()[0]; state.formKey = first.language + ":" + first.form; }
  save(); showWriter();
}

function showWriter() {
  $("langStep").hidden = true; $("writer").hidden = false; $("changeLang").hidden = false;
  applyText(); renderForms(); renderLines(); showStep(state.step || 1);
}

async function init() {
  load();
  forms = await (await fetch("/api/forms")).json();
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => chooseLang(b.dataset.lang)));
  $("changeLang").addEventListener("click", () => {
    $("langStep").hidden = false; $("writer").hidden = true; $("changeLang").hidden = true;
  });
  $("theme").value = state.theme; $("reflection").value = state.reflection;
  $("theme").addEventListener("input", e => { state.theme = e.target.value; save(); });
  $("reflection").addEventListener("input", e => { state.reflection = e.target.value; save(); });
  $("reflection").addEventListener("blur", () => screenText(state.reflection));
  $("pauseContinue").addEventListener("click", closePause);
  $("keep").addEventListener("click", keep);
  $("keepTxt").addEventListener("click", keepText);
  $("print").addEventListener("click", printPoem);
  $("openBtn").addEventListener("click", () => $("openFile").click());
  $("openStart").addEventListener("click", () => $("openFile").click());
  // Clear the input only after the read: clearing it at once can abort the read in Chromium.
  $("openFile").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) openSaved(f, () => { e.target.value = ""; }); });
  $("listen").addEventListener("click", listen);
  $("linkBtn").addEventListener("click", showLinks);
  $("addLine").addEventListener("click", addLine);
  document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => goTo(Number(b.dataset.step))));
  document.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => goTo(Number(b.dataset.goto))));
  $("clear").addEventListener("click", () => { if (confirm(T().clearAsk)) {
    state = { lang: state.lang, formKey: state.formKey, theme: "", reflection: "", lines: [], step: 1 }; save();
    $("theme").value = ""; $("reflection").value = ""; renderLines(); showStep(1); } });
  if (state.lang) showWriter(); else applyText();
  pollSetup();
}
init();
</script>
