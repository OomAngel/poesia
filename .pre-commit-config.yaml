# Pre-commit config for poesia — Tier 1 (see ~/dev/DEV_STANDARDS.md).
# Install: pre-commit install
repos:
  - repo: local
    hooks:
      - id: no-plaintext-secrets
        name: block plaintext credentials
        entry: bash tools/check_no_plaintext_secrets.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^secrets/.*\.sops\.ya?ml$

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks protect (staged secrets)
        entry: gitleaks protect --staged
        language: system
        pass_filenames: false
      - id: gitleaks-history
        name: gitleaks detect (full history)
        entry: gitleaks detect --verbose
        language: system
        pass_filenames: false
        stages: [manual]
