# Pre-commit config for poesia — Tier 1 (see ~/dev/DEV_STANDARDS.md).
# Install: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^secrets/.*\.sops\.ya?ml$





  - repo: https://github.com/OomAngel/pre-commit-hooks
    rev: v1.0.1
    hooks:
      - id: no-plaintext-secrets
        args: [--names, "CLOUDFLARE_API_TOKEN,DATABASE_URL,OPENAI_API_KEY,GROQ_API_KEY,GEMINI_API_KEY,REPLICATE_API_TOKEN,ANTHROPIC_API_KEY"]

      - id: gitleaks-protect

      - id: gitleaks-history

      - id: vulture
        args: ["src", --min-confidence=80]

      - id: refurb
        args: [--dont-fix]

      - id: pycycle
        args: [--here]

      - id: radon-cc
        args: [cc, "src", -s, -a]

      - id: xenon
        args: [--max-absolute, B, --max-modules, B, --max-average, B, "src"]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, src, -c, pyproject.toml]
        pass_filenames: false
        stages: [pre-push]
