# Pre-commit config for poesia — Tier 1 (see ~/dev/DEV_STANDARDS.md).
# Install: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--ignore-words=.codespell-ignore-words.txt"]
        # Spanish-language project: poetry corpus + data dirs are expected
        # non-English; ignore-words covers Spanish false positives in source.
        exclude: ^data/|^seeds/|^models/|^mlruns/|^memory-bank/|^share/|^dist/

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^secrets/.*\.sops\.ya?ml$





  - repo: https://github.com/OomAngel/pre-commit-hooks
    rev: v1.0.2
    hooks:
      - id: no-plaintext-secrets
        args: [--names, "CLOUDFLARE_API_TOKEN,DATABASE_URL,OPENAI_API_KEY,GROQ_API_KEY,GEMINI_API_KEY,REPLICATE_API_TOKEN,ANTHROPIC_API_KEY"]

      - id: gitleaks-protect

      - id: gitleaks-history

      - id: vulture
        args: ["src", "scripts/vulture_whitelist.py", --min-confidence=80]

      - id: refurb

      - id: pycycle
        args: [--here]

      - id: radon-cc
        args: [cc, "src", -s, -a]

      - id: xenon
        # CI-enforced complexity gate at C (was manual/advisory). The 2026-08-09
        # refactor cleared all F/E/D blocks; C is the accepted baseline and the
        # gate now blocks regressions to D+.
        args: [--max-absolute, C, --max-modules, C, --max-average, C, "src"]
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, src, -c, pyproject.toml]
        pass_filenames: false
        stages: [pre-push]
