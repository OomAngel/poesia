# Base spec: hardware-neutral. The same file on every machine.
#
# Do not create the env from this file alone: `scripts/env.sh create` adds the layer for
# this machine's hardware tier (requirements/<tier>.txt: gpu-cuda13 = desktop,
# gpu-cuda12 = laptop, cpu) to the pip section below and resolves both together, so torch
# comes from the tier's PyTorch index instead of PyPI's default CUDA build (several
# packages here, e.g. sentence-transformers, peft and accelerate, depend on torch).
# See README.md "Machines" and ~/dev/workspace-governance/MACHINES.md.
#
# Hardware-specific pins (torch, triton, nvidia-*/cuda-* runtime wheels) live only in the
# layers. The pins below are an export of the `poesia` env (2026-07-27), plus
# accelerate/mlflow/peft, which the scripts import but the export lacked, and g2p-en with
# its dependencies (added 2026-09-26; newest versions, resolved against this spec).
name: poesia
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - bzip2=1.0.8
  - ca-certificates=2026.7.16
  - ld_impl_linux-64=2.44
  - libexpat=2.8.2
  - libffi=3.4.8
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libmpdec=4.0.1
  - libstdcxx=15.2.0
  - libuuid=1.41.5
  - libxcb=1.17.0
  - libzlib=1.3.2
  - ncurses=6.5
  - openssl=3.5.7
  - packaging=26.0
  - pip=26.1.2
  - pthread-stubs=0.3
  - python=3.13.14
  - python_abi=3.13
  - readline=8.3
  - sqlite=3.53.2
  - tk=8.6.15
  - tzdata=2026c
  - wheel=0.47.0
  - xorg-libx11=1.8.12
  - xorg-libxau=1.0.12
  - xorg-libxdmcp=1.1.5
  - xorg-xorgproto=2024.1
  - xz=5.8.2
  - zlib=1.3.2
  - pip:
