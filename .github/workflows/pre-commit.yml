name: pre-commit
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit + gitleaks
        run: |
          python -m pip install pre-commit
          curl -sSfL --retry 3 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          test -x /usr/local/bin/gitleaks  # fail loudly
          chmod +x /usr/local/bin/gitleaks
      - name: Run pre-commit (all files)
        run: pre-commit run --all-files
