name: dependency-audit
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install project + pip-audit
        run: |
          python -m pip install -e . pip-audit
      - name: Audit dependencies
        run: pip-audit --desc
