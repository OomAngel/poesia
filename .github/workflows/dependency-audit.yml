name: dependency-audit
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the dependency set CI tests with + pip-audit
        # Before 2026-10-04 this installed only `-e .`, so it never saw mlflow or the
        # extras (mlflow 3.14.0 and cryptography 48.0.1 advisories went unnoticed).
        run: |
          python -m pip install -e ".[spanish,english,phonology-extra,nlp,mlops,dev]" pip-audit
          python -m pip install -r requirements/cpu.txt \
            datasets==5.0.1 peft==0.21.0 transformers==5.14.1 pyyaml==6.0.3 accelerate==1.15.0
      - name: Audit dependencies
        # PYSEC-2026-3740 (nltk): see the same exception in ci.yml.
        run: pip-audit --desc --ignore-vuln PYSEC-2026-3740
