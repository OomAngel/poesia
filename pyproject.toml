[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poesia"
version = "0.1.0"
description = "A hybrid poetry-writing engine: LLM generation validated by deterministic phonology/prosody, later extended with Graph RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angel" }]

# Core dependencies kept deliberately minimal at Phase 0.
# Heavier / optional stacks (LLM inference, C++ bindings) are extras below.
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Spanish phonology / scansion
spanish = [
    "rantanplan",
    "silabeador",
]

# English phonology / scansion
english = [
    "pronouncing",
    "cmudict",
    "prosodic",
]

# Multilingual phonology
phonology-multi = [
    "phonemizer",
    "epitran",
]

# Lightweight/alternative phonology backends (no eSpeak binary required,
# neural G2P fallback, cross-language hyphenation sanity-check)
phonology-extra = [
    "gruut",
    "g2p_en",
    "pyphen",
]

# Classical Language Toolkit — Latin/Greek metrical scansion, relevant
# since the "LLM validity" study cited in README was on Greek poetry.
classical = [
    "cltk",
]

# Interactive rhyme/near-rhyme/word discovery + statistical baseline
lexical-extra = [
    "python-datamuse",
    "markovify",
]


# Linguistic / semantic analysis
nlp = [
    "spacy",
    "sentence-transformers",
    "wn",
    "wordfreq",
]

# LLM orchestration (local + API)
llm = [
    "transformers",
    "llama-cpp-python",
    "guidance",
    "outlines",
]

# Graph RAG (Phase 3, not yet wired) — used by MemorIA's graphrag.py
graphrag = [
    "networkx",
    "neo4j",
]

# GalerIA: illustration — image generation backends + composition/export
illustration = [
    "Pillow",
    "openai",
    "replicate",
    "svgwrite",
    "weasyprint",
]

# GalerIA: local (offline, GPU-heavy) image generation alternative
illustration-local = [
    "diffusers",
]

# ArmonIA: music — symbolic score, audio synthesis, AI music generation, TTS
music = [
    "music21",
    "pretty_midi",
    "mido",
    "pyfluidsynth",
]

music-ai = [
    "audiocraft",
]

recitation = [
    "TTS",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "safety>=3.0",
]

# Convenience bundle for the plan discussed at repo creation
all-lang = ["poesia[spanish,english,phonology-multi,phonology-extra,nlp]"]


[project.scripts]
poesia = "poesia.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# E501 is enforced by `ruff format`; only long string literals (SQL, print
# alignment, URLs) remain, which are intentional.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Network client modules: urlopen/Request only ever touch validated HTTPS
# endpoints (OpenAI, Groq, Gemini, Ollama, Datamuse, Replicate). Intentional.
"src/poesia/generation/llm_client.py" = ["S310"]
"src/poesia/galeria/backends.py" = ["S310"]
# Network client: urlopen only ever touches the validated HTTPS Pollinations
# endpoint (image.pollinations.ai). Intentional.
"src/poesia/galeria/pollinations.py" = ["S310"]
# Deterministic art seeds derive from a prompt hash; random.Random is
# deliberate (reproducible composition), never cryptography.
"src/poesia/galeria/procedural.py" = ["S311"]
"src/poesia/generation/rhyme_fetcher.py" = ["S310"]
# Intentional silent handling of optional/best-effort features.
"src/poesia/evaluation/scorer.py" = ["S110"]
"src/poesia/generation/hooks.py" = ["S110"]
"src/poesia/memoria/seed_expander.py" = ["S110"]
"src/poesia/memoria/library.py" = ["S112"]
"src/poesia/phonology/spanish.py" = ["S110"]
"src/poesia/training/poetry_trainer.py" = ["S110"]

[tool.bandit]
exclude_dirs = ["tests/", "models/", "seeds/", ".git/", "mlruns/"]
skips = [
    "B101",  # Allow assert statements
    "B110",  # Intentional best-effort handlers (telemetry, optional backends)
    "B112",  # Skip malformed records when bulk-importing the library
    "B310",  # urlopen on validated HTTPS API endpoints only (network client modules)
    "B404",  # subprocess for trusted, internally-built command lists
    "B603",  # subprocess.run() with explicit arg lists — no shell, no user input
    "B615",  # HF from_pretrained() without revision pin — TODO: pin model revisions
]

[tool.safety]
ignore = []
output = "text"

[tool.mypy]
# NOTE: set to 3.12 because numpy>=2.5 ships type stubs using PEP 695
# `type` statements (Python 3.12 syntax). mypy's python_version only gates
# which syntax is *allowed* in checked code — the package still supports
# Python 3.11 at runtime (requires-python = ">=3.11").
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# numpy stubs currently use 3.12+ syntax which mypy (targeting 3.11) cannot
# parse; treat numpy as untyped rather than failing the whole run.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
